name: Deploy to Namecheap

on:
  push:
    branches:
      - main
    paths:
      - .htaccess
      - 404.html
      - app.js
      - assets/**
      - data/**
      - index.html
      - publicar-evento.html
      - robots.txt
      - sitemap.xml
      - styles.css
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview changes without uploading
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: pereira-es-salsa-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v6

      - name: Validate deployable files
        shell: bash
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f robots.txt
          test -f sitemap.xml
          test -f .htaccess
          test -d assets/images
          test -d data

      - name: Sync site over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          security: strict
          timeout: 60000
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            README.md
            pereira-es-salsa-deploy.zip

      - name: Verify production after deploy
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://www.pereiraessalsa.com/ | grep -q 'La salsa de Pereira'
          curl --fail --silent --show-error \
            https://www.pereiraessalsa.com/robots.txt | grep -q 'sitemap.xml'
          curl --fail --silent --show-error \
            https://www.pereiraessalsa.com/sitemap.xml | grep -q '<urlset'
